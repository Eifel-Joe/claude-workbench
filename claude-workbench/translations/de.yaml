configuration:
  auto_launch_claude:
    name: "Claude automatisch starten"
    description: "Öffnet Claude Code direkt beim Öffnen des Panels. Aus: zuerst das Sitzungsmenü."
  remote_control:
    name: "Remote Control"
    description: "Startet Claude mit Remote Control, damit du die Sitzung über claude.ai/code oder die Claude-App steuern kannst. Wirkt nur mit „Claude automatisch starten“."
  remote_control_session_name:
    name: "Name der Remote-Sitzung"
    description: "Fester Titel der Sitzung in der Sitzungsliste. Leer: Claude vergibt einen Namen."
  tmux_mouse:
    name: "Maus in tmux"
    description: "An: Mausrad und Wischen scrollen im Claude-Verlauf; Links nur über 🔗 Copy link, Markieren mit gedrückter Umschalttaste. Aus: normales Markieren und klickbare Links."
  dangerously_skip_permissions:
    name: "Ohne Rückfragen ausführen"
    description: "Claude führt Befehle und Dateiänderungen ohne Bestätigung aus. Nur nutzen, wenn du jedem Schritt vertraust."
  persistent_apk_packages:
    name: "Dauerhafte Systempakete"
    description: "Alpine-Pakete (apk), die bei jedem Start installiert werden und Neustarts überstehen, z. B. git oder vim."
  persistent_pip_packages:
    name: "Dauerhafte Python-Pakete"
    description: "Python-Pakete (pip), die bei jedem Start in die dauerhafte Python-Umgebung installiert werden."
  use_persistent_claude:
    name: "Claude Code in /data aktuell halten"
    description: "Installiert Claude Code in den dauerhaften Speicher, damit neue Versionen und Modelle ohne neues App-Image ankommen."
  auto_update_claude_on_start:
    name: "Claude Code beim Start aktualisieren"
    description: "Aktualisiert Claude Code bei jedem Start. Wirkt nur mit „Claude Code in /data aktuell halten“; aus: nur über das Sitzungsmenü."
  image_retention_days:
    name: "Eingefügte Bilder behalten (Tage)"
    description: "Eingefügte oder hineingezogene Bilder, die älter sind, werden beim Start aus /data/images gelöscht, damit sie die Backups nicht füllen. 0 behält alle."
  auto_continue:
    name: "Nach Nutzungslimit automatisch weitermachen"
    description: "Meldet Claude ein Nutzungslimit, tippt die App eine Minute nach dem Reset „continue“ in die Claude-Sitzung. Claude arbeitet dann ohne Aufsicht weiter, auch mit „Ohne Rückfragen ausführen“. Zur Laufzeit mit dem Knopf ⏩ oder `auto-continue on|off` umschaltbar; nach einem Neustart gilt wieder diese Einstellung."
  home_assistant_plugin:
    name: "Home-Assistant-Plugin für Claude"
    description: "Installiert das mitgelieferte Plugin homeassistant-config von ESJavadex: Claude kennt die aktuelle Home-Assistant-Syntax, prüft jede bearbeitete YAML-Datei und bekommt /ha-check, /ha-upgrade und /ha-find-duplicates. Aus: Plugin wird deaktiviert; auch /plugin kann es abschalten, ein App-Update behält das bei."
  statusline:
    name: "Statuszeile"
    description: "Die Leiste unter Claudes Eingabe, ein Baustein pro Eintrag in Anzeigereihenfolge. Claude: model, context, folder, duration, lines, usage, tokens. Haus: alerts, repairs, automations, backup, disk, core, updates, unavailable, battery, people, weather. Eine Entität als sensor.x oder CO2=sensor.x, --- für eine neue Zeile, -sensor.car_* blendet Entitäten aus den Haus-Bausteinen aus. Leer: Standard-Layout; off entfernt sie. Eine mit /statusline selbst gesetzte Statuszeile wird nie ersetzt."
