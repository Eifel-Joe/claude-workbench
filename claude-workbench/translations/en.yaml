configuration:
  auto_launch_claude:
    name: "Start Claude automatically"
    description: "Opens Claude Code as soon as you open the panel. Off: shows the session menu first."
  remote_control:
    name: "Remote Control"
    description: "Starts Claude with Remote Control so you can drive the session from claude.ai/code or the Claude app. Only works with “Start Claude automatically”."
  remote_control_session_name:
    name: "Remote session name"
    description: "Fixed title for the session in the session list. Empty: Claude picks a name."
  tmux_mouse:
    name: "Mouse in tmux"
    description: "On: mouse wheel and swiping scroll Claude's history; open links with 🔗 Copy link, select text while holding Shift. Off: normal selection and clickable links."
  dangerously_skip_permissions:
    name: "Run without asking"
    description: "Claude runs commands and edits files without asking first. Only use this if you trust every step."
  persistent_apk_packages:
    name: "Persistent system packages"
    description: "Alpine packages (apk) installed on every start and kept across restarts, e.g. git or vim."
  persistent_pip_packages:
    name: "Persistent Python packages"
    description: "Python packages (pip) installed on every start into the persistent Python environment."
  use_persistent_claude:
    name: "Keep Claude Code current in /data"
    description: "Installs Claude Code in persistent storage so new versions and models arrive without a new app image."
  auto_update_claude_on_start:
    name: "Update Claude Code on start"
    description: "Updates Claude Code on every start. Only with “Keep Claude Code current in /data”; off: update from the session menu only."
  image_retention_days:
    name: "Keep pasted images (days)"
    description: "Pasted or dropped images older than this are deleted from /data/images on start, so they do not fill your backups. 0 keeps them all."
  auto_continue:
    name: "Auto-continue after a usage limit"
    description: "When Claude reports a usage limit, types “continue” into the Claude session one minute after the reset. Claude then works on unattended, also with “Run without asking”. Switch it at runtime with the ⏩ button or `auto-continue on|off`; after a restart this setting applies again."
  home_assistant_plugin:
    name: "Home Assistant plugin for Claude"
    description: "Installs the bundled homeassistant-config plugin by ESJavadex: Claude learns current Home Assistant syntax, checks every YAML file it edits and gets /ha-check, /ha-upgrade and /ha-find-duplicates. Off disables it; /plugin can also turn it off, and an app update keeps that."
  statusline:
    name: "Status line"
    description: "The bar under Claude's prompt, one piece per entry in display order. Claude: model, context, folder, duration, lines, usage, tokens. Home: alerts, repairs, automations, backup, disk, core, updates, unavailable, battery, people, weather. Add an entity as sensor.x or CO2=sensor.x, --- for a new line, -sensor.car_* to leave entities out of the home pieces. Empty: the default layout; off removes it. A status line you made with /statusline is never replaced."
