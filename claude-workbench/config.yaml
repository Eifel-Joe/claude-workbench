---
name: "Claude Workbench"
description: "Workbench for Anthropic's Claude Code CLI in Home Assistant: web terminal, persistent auth and packages, image paste, HA and GitHub CLIs"
version: "3.5.0"
slug: "claude_workbench"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/Eifel-Joe/claude-workbench"

# Web interface configuration
ingress: true
ingress_port: 7680
panel_icon: mdi:code-braces-box
panel_title: "Claude Workbench"
panel_admin: true

# Port configuration
#
# No host ports are published. The app is reached exclusively through Home
# Assistant ingress, which enforces HA authentication.
#
# Publishing these ports would expose an unauthenticated, writable root shell
# (ttyd runs with --writable and no credentials) inside a container that holds
# /config read-write, the Supervisor manager role and SUPERVISOR_TOKEN. Ingress
# reaches the container over the internal Docker network and does not require a
# host port mapping, so there is nothing to gain and a full host takeover to
# lose. ttyd itself now binds to 127.0.0.1 and is only reachable through the
# ingress web interface on port 7680.

# App configuration options
options:
  auto_launch_claude: true
  remote_control: false
  remote_control_session_name: ""
  tmux_mouse: false
  dangerously_skip_permissions: false
  persistent_apk_packages: []
  persistent_pip_packages: []
  use_persistent_claude: true
  auto_update_claude_on_start: true
  image_retention_days: 30
  auto_continue: false

schema:
  auto_launch_claude: bool?
  remote_control: bool?
  remote_control_session_name: str?
  tmux_mouse: bool?
  dangerously_skip_permissions: bool?
  persistent_apk_packages:
    - str?
  persistent_pip_packages:
    - str?
  use_persistent_claude: bool?
  auto_update_claude_on_start: bool?
  image_retention_days: int(0,3650)?
  auto_continue: bool?

# Volume mappings for file access
map:
  # Home Assistant configuration, read-write, mounted at /config as before
  # (homeassistant_config defaults to /homeassistant)
  - type: homeassistant_config
    read_only: false
    path: /config
  - all_app_configs:rw    # Config/data folders of all other apps (e.g. AppDaemon, Node-RED, ESPHome)

# API access for Home Assistant integration
hassio_api: true
hassio_role: manager
homeassistant_api: true

# Service startup configuration
startup: services
