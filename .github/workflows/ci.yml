name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint shell and Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # SC1008: bashio shebang is not a shell ShellCheck knows.
          # SC1007: `CDPATH= cd` is a deliberate idiom.
          # SC2155: pre-existing style across the add-on scripts.
          shellcheck -S warning -e SC1008,SC1007,SC2155 -x \
            claude-workbench/run.sh \
            claude-workbench/scripts/*.sh \
            claude-workbench/scripts/persist-install \
            tests/*.sh

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: claude-workbench/Dockerfile
          # DL3018: Alpine packages are intentionally unpinned; the base image
          #         tag pins the repository snapshot.
          # DL3016: the npm fallback deliberately tracks latest; the lockfile
          #         pins the image service's own dependencies.
          ignore: DL3018,DL3016

      - name: Validate add-on YAML
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml missing")
          for f in ("claude-workbench/config.yaml", "repository.yaml"):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f"{f}: valid YAML")
          PY

  test:
    name: Regression suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same major as the image (Alpine 3.24 ships Node 24).
          node-version: "24"
          cache: npm
          cache-dependency-path: claude-workbench/image-service/package-lock.json

      - name: Install image service dependencies
        working-directory: claude-workbench/image-service
        run: npm ci

      - name: Audit image service dependencies
        working-directory: claude-workbench/image-service
        run: node ../../.github/scripts/audit-image-service.js

      - name: Run all suites
        run: ./tests/run-tests.sh

  # Real touch taps in real engines. The unit tests call listeners directly
  # and missed WebKit dropping the click after a cancelled pointerdown (the
  # key bar did nothing on iPhone). Approach: ESJavadex,
  # ESJavadex/claude-code-ha@ab961533.
  browser:
    name: Key bar in real browsers (Chromium, WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit

      - name: Real touch taps send keys and keep the terminal focus
        working-directory: tests/browser
        run: npm test

  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Builds only, never pushes. This is the check that was missing when the
      # ARMv7 architecture detection silently broke every 32-bit build.
      # amd64 is loaded into the runner's Docker to be booted below; booting
      # aarch64 under QEMU would take too long.
      - name: Build add-on image
        uses: docker/build-push-action@v7
        with:
          context: claude-workbench
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.arch == 'amd64' }}
          tags: local/claude-workbench:ci
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}

      # Boots the real image against a Supervisor that never answers (one
      # option read runs into its time limit, the others take their default),
      # with /data as Alpine 3.21 left it, then once more with a broken library
      # copy; see the script's header.
      - name: Boot the image against a silent Supervisor
        if: matrix.arch == 'amd64'
        run: tests/ci-boot-smoke.sh local/claude-workbench:ci
